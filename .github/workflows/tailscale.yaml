name: tailscale policy

# Tests the tailnet policy on PRs and applies it on main. This repo is the only
# writer: the admin console shows the policy as managed here.
on:
  push:
    branches: [main]
    paths: ["tailscale/policy.hujson", ".github/workflows/tailscale.yaml"]
  pull_request:
    branches: [main]
    paths: ["tailscale/policy.hujson", ".github/workflows/tailscale.yaml"]

concurrency:
  group: tailscale-policy
  cancel-in-progress: false

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Test policy
        if: github.event_name == 'pull_request'
        uses: tailscale/gitops-acl-action@5a4a17f5708e9bf96f4ee915a95e9f83c2eebe1a # v1
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tailnet: ${{ secrets.TS_TAILNET }}
          action: test
          policy-file: tailscale/policy.hujson

      - name: Apply policy
        if: github.event_name == 'push'
        uses: tailscale/gitops-acl-action@5a4a17f5708e9bf96f4ee915a95e9f83c2eebe1a # v1
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tailnet: ${{ secrets.TS_TAILNET }}
          action: apply
          policy-file: tailscale/policy.hujson
